<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/icons/logo.png" aria-details="coffe logo">
  <title>BRUM</title>
  <script src="./admin/admin.js" defer></script>
  <script src="./wizard/wizard.js" defer></script>
  <script src="./forms/forms.js" defer></script>
  <link rel="stylesheet" href="/src/output.css">
  <link rel="stylesheet" href="public/style.css">
</head>

<body >

  <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
  <form class="flex flex-col  gap-y-1 px-100 py-10" id="mainFormWrapper">
    <progress></progress>


    <!-- FIRST PAGE -->
    <fieldset class="flex  flex-col gap-x-10 gap-y-7 " id="firstRang">
      <legend >General Information</legend>
      <!-- Error message -->
      <label> Coffe Name
        <small class=" text-red-800 " id="coffeMessage"></small>
        <input type="text"  id="coffeName" name="coffeName">
      </label>

      <label> Base Price
        <small class=" text-red-800 " id="priceMessage"></small>
        <input type="text" min="0" step="0.01"  id="basePrice" name="basePrice">
      </label>

      <label >Description
        <small class=" text-red-800 " id="descriptionMsg"></small>
        <textarea style="display: block;"  class="basis-3xs"  name="description" id="description"></textarea>
      </label>

      <label>Product Image
        <small class=" text-red-800 " id="imageMsg"></small>
        <input type="url"  id="productImage" name="productimage">
      </label>

      <label class="flex">Coffe  <br> Promotion ?
        <input type="checkbox" class="w-24" id="promotion" name="promotion">
      </label>

      <!-- if checkbox checked then show discount percentage -->
      <div id="ShowedIfPromoCheckedSpn" style="display: none;">
        <label> Discount Percentage %
          <small class=" text-red-800 " id="discountMsg"></small>
          <input type="text"  id="discount" name="discount">
        </label>

        <label>End Date
          <small class=" text-red-800 " id="endDateMsg"></small>
          <input type="date"  id="expireDate" name="expireDate">
        </label>
      </div>
      <button type="button"  id="next1">Next</button>

    </fieldset>



    <!-- SECOND PAGE -->
    <fieldset class="flex  flex-col gap-x-10 gap-y-7 " id="secondRange">

      <legend>Features & Options</legend>
      <label> <h4 class="text-xl font-bold" style="display: inline-block;" >Origin of grains  :</h4>
        <select  name="origin" id="selectOrigin">
          <!-- "disabled" for insuring this option is unclickable "selected" default selected -->
          <option value="" disabled selected>Select Origin of grains:</option>
          <option value="colombia">Colombia</option>
          <option value="ethiopia"> Ethiopia</option>
          <option value="brazil">Brazil</option>
          <option value="mix">Homemade Blend</option>
        </select>
      </label>

      <label class="flex  flex-row gap-x-10 gap-y-7 " style="display: inline-block;">
        <h4 class="text-xl font-bold" style="display: inline-block;"  >Roasting level /Intensity:</h4>
        <input type="range"  id="intensity" name="intensity" step="1" min="1" max="10">
      </label>

      <span>
        <h4 class="text-xl font-bold ">Temperature</h4>
        <label>Hot
          <input type="radio" name="temperature" id="hot" value="Hot">
        </label>
        <label> Frozen
          <input type="radio" name="temperature" id="Frozen" value="Frozen">
        </label>
      </span>

      <span>
        <h4 class="text-xl font-bold" >Available sizes</h4>
        <label>Small
          <input type="checkbox" id="small" name="sizes" value="small">
        </label>
        <label>Medium
          <input type="checkbox" id="meduim" name="sizes" value="medium">
        </label>
        <label>Large
          <input type="checkbox" id="large" name="sizes" value="large">
        </label>
      </span>

      <span>
        <h4 class="text-xl font-bold" >Milk options</h4>
        <label>Cow
          <input type="checkbox" name="milk" id="Cow" value="Cow">
        </label>

        <label>Oats
          <input type="checkbox" name="milk" id="Oats" value="Oats">
        </label>

        <label>Soy
          <input type="checkbox" name="milk" id="Soy" value="Soy">
        </label>

        <label>Almond
          <input type="checkbox" name="milk" id="Almond" value="Almond">
        </label>
      </span>

      <span>
        <h4 class="text-xl font-bold">Supplements</h4>
        <label>Vanilla
          <input type="checkbox" name="supplements" id="vanilla" value="Vanilla">
        </label>

        <label>Caramel
          <input type="checkbox" name="supplements" id="caramel" value="Caramel">
        </label>

        <label>Hazelnut
          <input type="checkbox" name="supplements" id="Hazelnut" value="Hazelnut">
        </label>

      </span>
      <span class=" flex gap-x-10 gap-y-7" >
        <button  id="optionsPreviousBtn"> Previous </button>
        <button  id="optionsNextBtn"> Next</button>
      </span>
    </fieldset>

    <section class="DisplaySummarySection" class="ThirdRange" >
      <h4 class="text-xl font-bold" >Displayed Forms</h4>
      <button type="reset"></button>
    </section>
  </form>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>

</html>
