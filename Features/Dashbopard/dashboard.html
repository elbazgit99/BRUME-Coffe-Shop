<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRUM</title>
  <link rel="icon" href="/assets/icons/logo.png" aria-details="coffe logo">
  <script src="./admin/admin.js" async></script>
  <script src="./wizard/wizard.js" async></script>
  <script src="./forms/forms.js" async></script>
  <link rel="stylesheet" href="../../src/output.css">
  <link rel="stylesheet" href="public/style.css">
</head>

<body>

  <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
  <form class="grid h-56 grid-cols-3 content-start gap-4 " id="mainFormWrapper">
    <fieldset class="flex flex-col" id="firstRang">
      <legend></legend>
      <!-- Error message -->
      <label> product Name
        <h3 class="bg-blue-500 text-red-800 " id="productMessage"></h3>
        <input type="text" class="border-4 border-indigo-500" id="productName" name="productName">
        <h2> Informations Générales </h2>
      </label>

      <label> Base price
        <h3 class="bg-blue-500 text-red-800 " id="priceMessage"></h3>
        <input type="number" class="border-4 border-indigo-500" id="basePrice" name="baseprice">
      </label>
      <h3 class="bg-blue-500 text-red-800 " id="descriptionMsg"></h3>
      <textarea class="border-4 border-indigo-500" name="description" id="description">description</textarea>

      <label>product image
        <input type="url" class="border-4 border-indigo-500" id="productImage" name="productimage">
      </label>

      <label>product promotion
          <h3 class="bg-blue-500 text-red-800 " id="imageMessage"></h3>
        <input type="checkbox" class="border-4 border-indigo-500" id="promotion" name="promotion">
      </label>

      <span id="ShowedIfPromotionCheckedSpn" style="display: none;">
        <label> discount percentage
          <input class="border-4 border-indigo-500" type="number" id="discount" name="discount">
        </label>

        <label>Date de fin
          <input class="border-4 border-indigo-500" type="date" id="expireDate" name="expireDate">

        </label>
        <button class="border-4 border-indigo-500" id="next1">NEXT</button>
      </span>
    </fieldset>


    <fieldset id="secondRange">

      <legend> Caractéristiques & Options </legend>
      <label> Origine des grains
        <h3 class="bg-blue-500 text-red-800 " id="optionMsg"></h3>
        <select class="border-4 border-indigo-500" name="origin" id="selectOrigin">
          <option value="" selected disabled>choose an origin</option>
          <option value="colombia">colombie</option>
          <option value="ethiopia"> ethiopie</option>
          <option value="brazil">Bresil</option>
          <option value="mix">melange maison</option>
        </select>
      </label>
      <label>Niveau de torréfaction / Intensité
        <input class="border-4 border-indigo-500" type="range" id="intensity" name="intensity" min="1" max="10">
      </label>

      <span>
        <h3>Température</h3>
        <label>chaud
          <input type="radio" id="hot" name="Temperature" value="chaud">
        </label>
        <label> glacé
          <input type="radio" name="Temperature" id="iced" value="glacé">
        </label>
      </span>

      <span>
        <h3> Tailles disponibles </h3>
        <label>Small
          <input type="checkbox" id="small" name="sizes" value="small">
        </label>
        <label>Medium
          <input type="checkbox" id="meduim" name="sizes" value="medium">
        </label>
        <label>Large
          <input type="checkbox" id="large" name="sizes" value="large">
        </label>

      </span>

      <div>
        <h3> Options de lait </h3>
        <label>Vache
          <input type="checkbox" name="milk" id="cowmilk" value="vache">
        </label>

        <label>Avoine
          <input type="checkbox" name="milk" id="oatmilk" value="avoine">
        </label>

        <label>Soja
          <input type="checkbox" name="milk" id="soymilk" value="soja">
        </label>

        <label>Amande
          <input type="checkbox" name="milk" id="almondmilk" value="amande">
        </label>
      </div>
      <span>
        <h3>Suppléments</h3>
        <label>Vanille
          <input type="checkbox" name="supplements" id="vanilla" value="Vanille">
        </label>

        <label>Caramel
          <input type="checkbox" name="supplements" id="caramel" value="Caramel">
        </label>

        <label>Noisette
          <input type="checkbox" name="supplements" id="noisette" value="Noisette">
        </label>
        <button type="button" id="previous1"> Previous </button>
        <button class="border-4 border-indigo-500" type="button" id="next2"> NEXT </button>
      </span>
    </fieldset>

    <section id="thirdRange">

    </section>
  </form>
</body>

</html>
