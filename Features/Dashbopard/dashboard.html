<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/icons/logo.png" aria-details="coffe logo">
  <title>BRUM</title>
  <script src="./admin/admin.js" async></script>
  <script src="./wizard/wizard.js" async></script>
  <script src="./forms/forms.js" async></script>
  <link rel="stylesheet" href="../../src/output.css">
  <link rel="stylesheet" href="public/style.css">
</head>

<body>

  <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
  <form class="grid h-56 grid-cols-3 content-start gap-4 " id="mainFormWrapper">
    <!-- FIRST PAGE -->
    <fieldset class="flex flex-col" id="firstRang">
      <legend>General Information</legend>
      <!-- Error message -->
      <label> Coffe Name
        <h3 class="bg-blue-500 text-red-800 " id="coffeMessage"></h3>
        <input type="text" class="border-4 border-indigo-500" id="coffeName" name="coffeName">
        <h2> Informations Générales </h2>
      </label>

      <label> Base Price
        <h3 class="bg-blue-500 text-red-800 " id="priceMessage"></h3>
        <input type="number" min="0" step="0.01" class="border-4 border-indigo-500" id="basePrice" name="basePrice">
      </label>

      <textarea class="border-4 border-indigo-500" name="description" id="description">description</textarea>

      <label>Product Image
        <input type="url" class="border-4 border-indigo-500" id="productImage" name="productimage">
      </label>
      <!-- if this checked then show discount percentage -->
      <label>Coffe Promotion
        <input type="checkbox" class="border-4 border-indigo-500" id="promotion" name="promotion">
      </label>

      <!-- if checkbox checked then show discount percentage -->
      <label> Discount Percentage
        <input type="number" class="border-4 border-indigo-500" id="discount" name="discount">
      </label>
      <!-- if checkbox checked then show End Date -->
      <label>End Date
        <input type="date" class="border-4 border-indigo-500" id="expireDate" name="expireDate">
      </label>

      <button class="border-4 border-indigo-500" id="next1">NEXT</button>

    </fieldset>

    <!-- SECOND PAGE -->
    <fieldset id="secondRange">

      <legend>Features & Options</legend>
      <label>Origin of grains:
        <select class="border-4 border-indigo-500" name="origin" id="origin">
          <!-- "disabled" for insuring this option is unclickable "selected" default selected -->
          <option value="" disabled selected>Select Origin of grains:</option>
          <option value="colombia">Colombia</option>
          <option value="ethiopia"> Ethiopia</option>
          <option value="brazil">Brazil</option>
          <option value="mix">Homemade Blend</option>
        </select>
      </label>

      <label>Roasting level /Intensity:
        <input type="range" class="border-4 border-indigo-500" id="intensity" name="intensity" min="1" max="10">
      </label>

      <span>
        <h4>Temperature</h4>
        <label>Hot
          <input type="radio" name="temperature" id="hot" value="Hot">
        </label>
        <label> Frozen
          <input type="radio" name="temperature" id="Frozen" value="Frozen">
        </label>
      </span>

      <span>
        <h4>Available sizes</h4>
        <label>Small
          <input type="checkbox" id="small" name="sizes" value="small">
        </label>
        <label>Medium
          <input type="checkbox" id="meduim" name="sizes" value="medium">
        </label>
        <label>Large
          <input type="checkbox" id="large" name="sizes" value="large">
        </label>
      </span>

      <span>
        <h4>Milk options</h4>
        <label>Cow
          <input type="checkbox" name="milk" id="Cow" value="Cow">
        </label>

        <label>Oats
          <input type="checkbox" name="milk" id="Oats" value="Oats">
        </label>

        <label>Soy
          <input type="checkbox" name="milk" id="Soy" value="Soy">
        </label>

        <label>Almond
          <input type="checkbox" name="milk" id="Almond" value="Almond">
        </label>
      </span>

      <span>
        <h3>Supplements</h3>
        <label>Vanilla
          <input type="checkbox" name="supplements" id="vanilla" value="Vanilla">
        </label>

        <label>Caramel
          <input type="checkbox" name="supplements" id="caramel" value="Caramel">
        </label>

        <label>Hazelnut
          <input type="checkbox" name="supplements" id="Hazelnut" value="Hazelnut">
        </label>

      </span>
      <span>
        <button class="border-4 border-indigo-500" id="optionsPreviousBtn"> Previous </button>
        <button class="border-4 border-indigo-500" id="optionsNextBtn"> Next</button>
      </span>
    </fieldset>

    <section class="DisplaySummarySection" class="ThirdRange" >
      <h4>Displayed Forms</h4>
    </section>
  </form>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>

</html>
