<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRUM</title>
  <link rel="icon" href="./assets/icons/logo.png" aria-details="coffe logo">
  <link rel="stylesheet" href="checkout.css">
</head>

<body>

  <main>
    <!-- style="display: none;" -->
    <section class="coffeAndForm-section">
      <!-- 2 -->
      <div id="coffe-card-and-invoice">
        <!-- 3 -->
        <div class="recapitulatif-hidden-card">

          <span class="recapitulatif-badge">✓ Sélection ajoutée</span>
          <h5>Votre récapitulatif</h5>
          <small class="price-smalls">Une création personnalisée · Quantité : 0</small>

          <div class="coffeListWrapper">
            <span id="plusMinseDisplaySpn">
              <button class="lastSmall displayCoffeeCartBtns"> Votre sélection reste modifiable à tout moment.</button>
              <span id="plusMinsSpn">
                <button id="plusBtn" class="countBtns roundBtns">+</button>
                <span id="result">0</span>
                <button id="minseBtn" class="countBtns roundBtns">-</button>
              </span>
            </span>
            <button class="createOtherCoffeBtn" id="createBtn">Créer café →</button>
          </div>
          <span class="total-spn">
            <span>Total</span>
            <span class="invoicePrice">00,00 DH</span>
          </span>
          <a class="modifier" href="#">Modifier</a>

        </div>
      </div>
    </section>




    <section id="modalWrapper">
      <form id="modalForm">
        <label id="lbl">Coffe Products
          <input type="search" id="searchModal" name="modal">
          <button class="roundBtns">x</button>
        </label>
      </form>
    </section>

    <section class="coffeAndForm-section" id="paymentForm" style="display: none;">
      <div id="byCoffe-form" class="paymentForm">
        <img src="/assets/images/bank card.png" alt="">

        <form class="formWrapper" aria-labelledby="aria-labelled">
          <label>Card Number
            <input type="number" name="cardNumber" id="cardNumber" placeholder="123" alt="card Number" required>
          </label>
          <fieldset>
            <label> card Holder
              <input type="text" name="CardHolder" id="CardHolder" alt="Card Holder" placeholder="Joen Deo" required>
            </label>

            <label>Expiration
              <input type="date" name="Expiration" id="Expiration" alt="Expiration" placeholder="Expiration" required>
            </label>

            <label>CVV
              <input type="text" name="CVV" id="CVV" alt="CVV" placeholder="123" minlength="3" maxlength="3" required>
            </label>

          </fieldset>
          <button id="payBtn" class="Btns">gg</button>
        </form>
      </div>
    </section>



    <!-- <section>
      <div id="total-sec">
        <span>
          <small id="total-word">Total</small>
          <small id="totalPrice">00,00 DH</small>
        </span>
        <button type="submit" id="add-to-cart-btn">Ajouter au panier</button>
      </div>
    </section> -->



  </main>
  <script src="./cart/script.js"></script>
  <script src="./liveSearch/script.js"></script>
  <script src="./validation/script.js"></script>
</body>

</html>
